<html lang="zh-CN" data-theme="dark" data-draft-id="f-wb-welcome-01">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>f-wb-welcome-01 欢迎态 · 还没有任何项目（v2 补全稿）</title>
<link rel="stylesheet" href="../../pilot/assets/tokens-v2.css">
<link rel="stylesheet" href="../../pilot/assets/components-v2.css">
<link rel="stylesheet" href="assets/gap-shared.css">
<link rel="stylesheet" href="assets/pages/l6a-wb.css">
</head>
<body>
<div class="frame">
  <a class="skip-link" href="#main">跳到主区</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="侧栏">
      <div class="sidebar__top">
        <div class="scope">
          <a class="scope__home" href="#" title="回到工作台"><span class="scope__logo" aria-hidden="true">A</span><span class="scope__name">Agent 管理平台</span><span class="badge badge--20 badge--neutral">本机</span></a>
          <button class="btn btn--tertiary btn--28 btn--icon scope__menu" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="实例菜单：系统状态、外观、快捷键" title="实例菜单"><span class="icon i-chevrons-up-down" aria-hidden="true"></span></button>
        </div>
        <button class="find" type="button" aria-haspopup="dialog" aria-keyshortcuts="Meta+K" aria-label="查找任务、项目与动作（⌘K）"><span class="icon i-search" aria-hidden="true"></span><span class="find__text">查找…</span><span class="kbd" aria-hidden="true">⌘K</span></button>
      </div>

      <nav class="nav" aria-label="主导航">
        <a class="nav-item is-current" href="#" aria-current="page"><span class="icon i-square-terminal" aria-hidden="true"></span><span class="nav-item__label">任务</span><span class="u-sr-only" role="status"></span></a>
        <a class="nav-item" href="#"><span class="icon i-key-round" aria-hidden="true"></span><span class="nav-item__label">凭证管理</span></a>
        <a class="nav-item" href="#"><span class="icon i-package" aria-hidden="true"></span><span class="nav-item__label">镜像管理</span></a>
        <a class="nav-item" href="#"><span class="icon i-activity" aria-hidden="true"></span><span class="nav-item__label">系统状态</span></a>
      </nav>

      <div class="sidebar__sep" role="separator"></div>

      <section class="sidebar__section" aria-labelledby="sb-projects">
        <div class="sidebar__section-head">
          <h2 class="sidebar__section-title" id="sb-projects">项目</h2>
          <div class="sidebar__section-tools">
            <button class="btn btn--tertiary btn--24 btn--icon" type="button" aria-haspopup="dialog" aria-label="新建项目" title="新建项目"><span class="icon icon--14 i-folder-plus" aria-hidden="true"></span></button>
          </div>
        </div>
        <div class="sidebar__scroll">
          <nav class="tree" aria-label="项目分组任务树"></nav>
        </div>
      </section>

      <div class="sidebar__footer">
        <button class="btn btn--tertiary btn--32 btn--icon" type="button" aria-haspopup="menu" aria-label="外观" title="外观：跟随系统 / 亮色 / 暗色"><span class="icon i-sun-moon" aria-hidden="true"></span></button>
        <button class="btn btn--tertiary btn--32 btn--icon" type="button" aria-haspopup="dialog" aria-label="快捷键" title="快捷键"><span class="icon i-keyboard" aria-hidden="true"></span></button>
        <div class="sidebar__footer-end"><button class="btn btn--tertiary btn--32 btn--icon" type="button" aria-keyshortcuts="Meta+B" aria-expanded="true" aria-controls="sidebar" aria-label="收起侧栏" title="收起侧栏（⌘B）"><span class="icon i-panel-left-close" aria-hidden="true"></span></button></div>
      </div>
    </aside>

    <div class="shell__main">
      <header class="header">
        <h1 class="u-sr-only">工作台：还没有项目</h1>
        <div class="header__lead">
          <span class="wb-crumb-static">未选择项目</span>
        </div>
        <div class="header__actions">
          <button class="btn btn--primary btn--32" type="button" aria-haspopup="dialog" aria-disabled="true" aria-describedby="why-new" title="先新建一个项目"><span class="icon i-plus" aria-hidden="true"></span><span class="btn__label">新任务</span></button><span class="u-sr-only" id="why-new">先新建一个项目</span>
        </div>
      </header>

      <main class="main" id="main">
        <div class="empty empty--fill empty--viewport wb-welcome">
          <div class="empty__icon"><span class="icon i-folder-plus" aria-hidden="true"></span></div>
          <p class="wb-welcome__kicker">欢迎使用 · 第一步</p>
          <h2 class="empty__title">为你的代码建一个项目</h2>
          <p class="empty__desc">先有项目，再在项目里发起任务。每个任务都在项目代码的一份副本上干活，互不干扰。</p>
          <div class="empty__actions">
            <div class="wb-entry-grid" role="group" aria-label="新建项目的两种方式">
              <button class="wb-entry" type="button" aria-haspopup="dialog" aria-labelledby="we-git-t" aria-describedby="we-git-d">
                <span class="wb-entry__head"><span class="wb-entry__icon"><span class="icon i-folder-git-2" aria-hidden="true"></span></span><span class="icon wb-entry__go i-arrow-right" aria-hidden="true"></span></span>
                <span class="wb-entry__title" id="we-git-t">用我的代码库</span>
                <span class="wb-entry__desc" id="we-git-d">填 Git 仓库地址，平台把代码克隆到这台机器上。私有仓库会先引导你配好 Git 凭证。</span>
              </button>
              <button class="wb-entry" type="button" aria-haspopup="dialog" aria-labelledby="we-empty-t" aria-describedby="we-empty-d">
                <span class="wb-entry__head"><span class="wb-entry__icon"><span class="icon i-folder" aria-hidden="true"></span></span><span class="icon wb-entry__go i-arrow-right" aria-hidden="true"></span></span>
                <span class="wb-entry__title" id="we-empty-t">开一个空项目</span>
                <span class="wb-entry__desc" id="we-empty-d">从一个空目录开始，不关联任何仓库。名称先填好<strong>「未命名项目 1」</strong>，建之前可以改。</span>
              </button>
            </div>
            <p class="wb-welcome__next"><span class="badge badge--20 badge--neutral">第二步</span>项目就绪后会自动选中，接着就能发起第一个任务。</p>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>
</body>
</html>
