  对应 v1 稿件: 无（新设计）。内容按现状只读条的空项目分支（ProjectInfoBar.view.tsx:109-134：「空项目（没有关联仓库）」+「创建于」）；主区与树照 pilot/p6-empty-no-task.html；浮层容器同 f-prj-info-01
  体现的 v2 要点:
    - 浮层卡 .popover 去掉页脚（README §5.2「空项目：去掉页脚」）；.kv 两行
    - 主区空态 .empty--fill.empty--viewport（P6）；顶栏「新任务」按 P6 规则降为次按钮（主区空态里有同名实心按钮，foundation §1.4 创建入口）
    - 树：只选了项目 → 项目行是唯一当前项（.tree-project.is-current）+ 组下「发起第一个任务」（P6 同写法）
    - W4 评审修正（notes/consistency.md §8）：树里克隆失败 / 克隆中、还没有任务的项目（acme-api / infra-scripts）折叠箭头画成不可用：aria-disabled + title 写原因 + 禁用色（REQ-PRJ-011；禁用色规则从 l1a-prj §4 上提 gap-shared §11，评审 R2-02）
  与 v1 的差异（逐条；「需看稿」= 形态变化，要用户确认）:
    1. 顶栏：空项目没有分支，chip 写「空项目」（i-info 图标；Git 项目是 git-branch + 分支名）；没有 [拉取最新代码]（空项目不能拉取：现状 canSync 只给就绪的 Git 项目，后端对空项目 409）。chip 文案是新增可见文字，需看稿。
    2. 卡里两行：现状只读条把「空项目（没有关联仓库）」写成一句灰字、「最后拉取」一格换成「创建于」（F21-6 §9.2 表格最后一行）→ 同一张 .kv 里的「仓库」「创建于」两行，文字不变。需看稿。
    3. 没有页脚（没有动作，也就没有作用范围说明）。
    4. 主区与树：照 P6（项目下还没有任务），项目名换成 acme-api；acme-api 置顶为当前项目、徽标「克隆失败」已消失。
    5. 外壳整体换成 P1 方案 A（逐条差异与「需看稿」见 pilot/p1-workbench-waiting.html 头注释第 1–21 条，这里不重复）；实例菜单按 Q-DS-34 默认 A 去掉「文档」（aria-label「实例菜单：系统状态、外观、快捷键」，README §2 第 1 条）。
  示例数据来源: 原型示例世界（pilot/proto/proto.js PROJECTS / tasks；README §7）+ plan.json conventions.sample_world 增补（acme-web 两个新任务、各项目的保留下来的成果与自动化规则条数）。acme-api（原型：克隆失败 · 网络错误）走 F-PRJ-CLONE「改为空项目」之后的样子（与 prj-a 的 f-prj-clone-07 同一刻）；「创建于」取 v1 g7-07 信息条里的 2026/10/2 10:05:12（g7-07 没有 updatedAt 时这一格显示的就是创建时间）
  流程: F-PRJ-INFO（REQ-PRJ-020）
  口径依据: plan F-PRJ-INFO REQ-PRJ-020（空项目写「空项目（没有关联仓库）」+ 创建于，无拉取）；现状 ProjectInfoBar.view.tsx:109-112（空项目最后一格显示创建时间）、:121-123、:136（空项目不给按钮）；api Project.assertCanSync（非就绪或空项目 409 INVALID_STATE，project-application.service.ts:383-390）；P6 创建入口规则
