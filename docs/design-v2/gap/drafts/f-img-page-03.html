<!--
  id: f-img-page-03
  页面: 21-4 镜像管理（/settings/images）· 列表读不到
  状态: 进镜像页，骨架之后 GET /api/images 连续失败（查询默认重试 2 次之后）：页头（h1 + [注册新镜像]）与工具行（搜索 + 分段过滤）照常；「已注册的 OCI 镜像」下面不出卡片、不出空态，只有一条读取失败提示 .note--warn（role="alert"）「镜像列表没能加载出来 —— 这不代表没有镜像，只是现在读不到。」+ 行尾 [重试]；点 [重试] 这次成功就回到正常列表
  对应 v1 稿件: 无（新设计）——v1 g5 组只有加载中（g5-15b）与空态（g5-15），没有读取失败；结构取自同页的 f-img-page-02（页头、工具行、分区标题逐字同）+ 凭证页读取失败条 f-crd-page-02（.note--warn.note--center，琥珀三角 + 正文色句子 + 行尾 secondary 32 [重试]）
  体现的 v2 要点:
    - 读取失败条（foundation §3.17、UX-DS-305）：放在列表的位置、与卡片同宽，内边距 14 16（本组 CSS l4a-img §7 .l4a-load-fail，与 l3b-crd .crd-load-fail 同值）；色调只在三角图标，句子正文色（P6）；role="alert"
    - 「读不到 ≠ 没有」：不渲染「还没有注册任何镜像」空态，也不在列表位置给 [注册新镜像] 这类 CTA（REQ-IMG-052）；页头的 [注册新镜像] 照常（页头不随列表状态变化）
    - 页头与工具行照常可用（同 f-img-page-02）；外壳照 P7
  与 v1 的差异（逐条；「需看稿」= 形态变化）:
    1. 新增读取失败一态（v1 / 现状没有：失败后「库里 0 行」判定成立，显示「还没有注册任何镜像」与 [注册新镜像]，useImages.ts:894-896、ImagesContainer.tsx:96-127——把「读不到」说成「没有」）。需看稿。
    2. 句子与凭证页 Git 读取失败条同一句式（「…没能加载出来 —— 这不代表…，只是现在读不到。」，f-crd-page-02）；原型 W3 已按这一句接线（REQ-IMG-052 没有稿件时的最小版），本稿把它定下来。
  示例数据来源: 无业务数据（列表没读出来）；页头与工具行照 P7 / f-img-page-02
  流程: F-IMG-PAGE（REQ-IMG-050–059；本稿覆盖 REQ-IMG-052）
  口径依据: REQ-IMG-052（AC-IMG-052.1 / 052.2）；UX-DS-305（读取失败原位 role=alert，不得显示成空）；同类写法 f-crd-page-02（REQ-CRD-031）；实现 web/src/hooks/image/useImages.ts:60-66、894-896，web/src/containers/image/ImagesContainer.tsx:89-133，web/src/app/providers.tsx:37（查询默认重试 2 次）；W4 评审 R2-34③ 补稿（notes/consistency.md §8）
-->
