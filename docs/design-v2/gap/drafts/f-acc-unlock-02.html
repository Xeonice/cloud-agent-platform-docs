<html lang="zh-CN" data-theme="dark" data-draft-id="f-acc-unlock-02">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>f-acc-unlock-02 口令门 · 需要访问口令</title>
<link rel="stylesheet" href="../../pilot/assets/tokens-v2.css">
<link rel="stylesheet" href="../../pilot/assets/components-v2.css">
<link rel="stylesheet" href="assets/gap-shared.css">
<link rel="stylesheet" href="assets/pages/l3a-auth.css">
</head>
<body>
<div class="frame">
  <main class="gate">
    <div class="gate__brand"><span class="scope__logo" aria-hidden="true">A</span><span class="scope__name">Agent 管理平台</span><span class="badge badge--20 badge--neutral">本机</span></div>
    <div class="gate__card" role="dialog" aria-modal="true" aria-label="访问口令">
        <form class="gate__form">
          <div class="gate__head">
            <h1 class="gate__title">需要访问口令</h1>
            <p class="gate__desc">这个平台设了访问口令，输入后才能继续。</p>
          </div>
          <div class="field">
            <label class="field__label" for="passcode">访问口令</label>
            <input class="input" id="passcode" type="password" name="passcode" autocomplete="off" aria-describedby="passcode-note" value="">
          </div>
          <button class="btn btn--primary btn--block" type="submit" disabled>解锁</button>
          <p class="form-note" id="passcode-note">口令只在首次启动时输出在服务日志里，可以找部署这台平台的人要；忘了可以用环境变量 <code class="code">ACCESS_PASSCODE</code> 重设。</p>
        </form>
      </div>
  </main>
</div>
</body>
</html>
