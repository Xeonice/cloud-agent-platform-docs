<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent 管理平台 - 流程原型</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            font-size: 14px;
        }

        /* Layout */
        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #fff;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            gap: 20px;
            min-height: 56px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-weight: bold;
            font-size: 16px;
            min-width: 60px;
        }

        .project-switcher {
            position: relative;
        }

        .project-btn {
            padding: 8px 12px;
            background: #f0f0f0;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .project-btn:hover {
            background: #e8e8e8;
        }

        .project-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            background: #fff;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            margin-top: 4px;
            min-width: 200px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 100;
            display: none;
        }

        .project-dropdown.show {
            display: block;
        }

        .project-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }

        .project-item:hover {
            background: #f8f8f8;
        }

        .project-item.selected {
            background: #e3f2fd;
            font-weight: 500;
        }

        .project-divider {
            border-bottom: 1px solid #d0d0d0;
            margin: 4px 0;
        }

        .project-action {
            padding: 10px 12px;
            cursor: pointer;
            color: #0066cc;
        }

        .project-action:hover {
            background: #f8f8f8;
        }

        .banner {
            padding: 8px 20px;
            background: #fff3cd;
            border-bottom: 1px solid #ffc107;
            display: none;
            align-items: center;
            gap: 12px;
        }

        .banner.show {
            display: flex;
        }

        .banner-btn {
            padding: 4px 12px;
            background: #ffc107;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }

        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            background: #fafafa;
        }

        .sidebar-header {
            padding: 12px;
            font-weight: bold;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .new-task-btn {
            padding: 6px 12px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
        }

        .new-task-btn:hover {
            background: #0052a3;
        }

        .task-item {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-item:hover {
            background: #f0f0f0;
        }

        .task-item.selected {
            background: #e3f2fd;
        }

        .task-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-preparing { background: #ffc107; animation: pulse 1s infinite; }
        .status-running { background: #4caf50; }
        .status-stopped { background: #999; }
        .status-failed { background: #f44336; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Modals and overlays */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 24px;
        }

        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #d0d0d0;
            margin-bottom: 16px;
        }

        .tab {
            padding: 8px 16px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: #666;
        }

        .tab.active {
            border-bottom-color: #0066cc;
            color: #0066cc;
            font-weight: 500;
        }

        .tab-content {
            display: none;
        }

        .tab-content.show {
            display: block;
        }

        .btn {
            padding: 8px 16px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .btn:hover {
            background: #0052a3;
        }

        .btn-secondary {
            background: #999;
        }

        .btn-secondary:hover {
            background: #777;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        /* Welcome state */
        .welcome-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 20px;
            text-align: center;
        }

        .welcome-title {
            font-size: 24px;
            font-weight: bold;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }

        .welcome-buttons {
            display: flex;
            gap: 16px;
        }

        .welcome-btn {
            padding: 12px 24px;
            border: 2px solid #0066cc;
            background: white;
            color: #0066cc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .welcome-btn:hover {
            background: #f0f7ff;
        }

        .welcome-btn.primary {
            background: #0066cc;
            color: white;
        }

        .welcome-btn.primary:hover {
            background: #0052a3;
        }

        /* Terminal area */
        .terminal-area {
            flex: 1;
            background: #1e1e1e;
            color: #00ff00;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .terminal-line {
            margin: 2px 0;
        }

        /* Progress card */
        .progress-card {
            background: #f0f0f0;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            padding: 16px;
            margin: 16px;
        }

        .progress-step {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .progress-step:last-child {
            margin-bottom: 0;
        }

        .progress-icon {
            width: 20px;
            text-align: center;
            font-weight: bold;
        }

        /* Runtime cards */
        .runtime-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .runtime-card {
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .runtime-card:hover {
            border-color: #0066cc;
            box-shadow: 0 2px 8px rgba(0,102,204,0.1);
        }

        .runtime-card.selected {
            border-color: #0066cc;
            background: #e3f2fd;
        }

        .runtime-name {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .runtime-status {
            font-size: 12px;
            color: #666;
        }

        .auth-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 12px;
            font-weight: 500;
        }

        .auth-badge.done {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .auth-badge.pending {
            background: #fff9c4;
            color: #f57f17;
        }

        /* Device code section */
        .device-code-section {
            text-align: center;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .device-code {
            font-size: 28px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            margin: 12px 0;
        }

        .countdown {
            font-size: 12px;
            color: #f44336;
        }

        /* API Key section */
        .api-key-section {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #323232;
            color: white;
            padding: 12px 16px;
            border-radius: 4px;
            display: none;
            z-index: 300;
            animation: slideIn 0.3s ease-out;
        }

        .toast.show {
            display: block;
        }

        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Debug panel */
        .debug-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: white;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 250;
        }

        .debug-header {
            padding: 8px 12px;
            background: #f0f0f0;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            border-bottom: 1px solid #d0d0d0;
        }

        .debug-content {
            display: none;
            padding: 8px;
            min-width: 200px;
        }

        .debug-content.show {
            display: block;
        }

        .debug-btn {
            display: block;
            width: 100%;
            padding: 4px 8px;
            margin-bottom: 4px;
            background: #f0f0f0;
            border: 1px solid #d0d0d0;
            border-radius: 2px;
            cursor: pointer;
            font-size: 11px;
            text-align: left;
        }

        .debug-btn:hover {
            background: #e0e0e0;
        }

        /* Doc anchor */
        .doc-anchor {
            font-size: 11px;
            background: #f5f5f5;
            padding: 2px 4px;
            border-radius: 2px;
            color: #888;
            margin-left: 8px;
            display: inline-block;
        }

        /* Confirmm dialog */
        .confirm-dialog {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            padding: 24px;
            max-width: 400px;
        }

        .confirm-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .confirm-message {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .confirm-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .alert {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            border-left: 4px solid #f44336;
            background: #ffebee;
            color: #c62828;
            font-size: 13px;
        }

        .alert.error {
            border-left-color: #f44336;
            background: #ffebee;
            color: #c62828;
        }

        .alert.success {
            border-left-color: #4caf50;
            background: #e8f5e9;
            color: #2e7d32;
        }

        .alert.warning {
            border-left-color: #ffc107;
            background: #fffbee;
            color: #f57f17;
        }

        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="app-shell" id="appShell">
    <!-- Topbar -->
    <div class="topbar">
        <div class="topbar-left">
            <div class="logo">☁️ Agent</div>
            <div class="project-switcher" id="projectSwitcher">
                <button class="project-btn" id="projectBtn">
                    <span id="projectName">选择项目</span>
                    <span>▾</span>
                </button>
                <div class="project-dropdown" id="projectDropdown">
                    <div id="projectList"></div>
                    <div class="project-divider"></div>
                    <div class="project-action" onclick="app.showCreateProjectModal()">+ 创建项目</div>
                    <div class="project-action" id="manageProjectMenu" style="display:none;" onclick="app.showProjectMenu()">🛠️ 管理当前项目</div>
                </div>
            </div>
        </div>
        <div style="position:relative;">
            <div style="cursor:pointer; display:flex; align-items:center; gap:4px;" onclick="app.toggleSettingsMenu()">
                cmdk · ⚙️ <span id="settingsMenuToggle">▸</span>
            </div>
            <div id="settingsMenu" style="position:absolute; top:100%; right:0; background:#fff; border:1px solid #d0d0d0; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,0.1); z-index:200; display:none; min-width:180px; margin-top:4px;">
                <div style="padding:8px 0;">
                    <div style="padding:8px 16px; cursor:pointer; font-size:13px;" onclick="app.showSettingsPage('credentials')">🔐 凭证管理</div>
                    <div style="padding:8px 16px; cursor:pointer; font-size:13px;" onclick="app.showSettingsPage('images')">📦 镜像管理</div>
                    <div style="padding:8px 16px; cursor:pointer; font-size:13px;" onclick="app.showSettingsPage('system')">📊 系统状态</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Banner -->
    <div class="banner" id="banner">
        <span id="bannerText"></span>
        <button class="banner-btn" id="bannerBtn"></button>
    </div>

    <!-- Content -->
    <div class="content">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span>📋 任务列表</span> <span class="doc-anchor">P20 §2</span>
            </div>
            <button class="new-task-btn" id="newTaskBtn" style="display:none;" onclick="app.startNewTask()">+ 新任务</button>
            <div id="taskList"></div>
        </div>

        <!-- Main area -->
        <div class="main" id="mainArea">
            <div id="mainContent"></div>
        </div>
    </div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal" onclick="event.stopPropagation()"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Debug panel -->
<div class="debug-panel">
    <div class="debug-header" onclick="document.querySelector('.debug-content').classList.toggle('show')">
        🐛 调试面板
    </div>
    <div class="debug-content">
        <button class="debug-btn" onclick="app.resetToColdStart()">↺ 重置到冷启动</button>
        <button class="debug-btn" onclick="app.resetToUninitialized()">🔧 重置为未初始化</button>
        <button class="debug-btn" onclick="app.jumpToStateWithTasks()">→ 有 2 个 Task 的状态</button>
        <button class="debug-btn" onclick="app.resetToNoCredState()">🔐 重置为无凭证状态</button>
        <button class="debug-btn" onclick="app.triggerCredExpiredBanner()">⚠️ 触发凭证过期横幅</button>
        <button class="debug-btn" onclick="app.showSettingsPage('images')">📦 镜像管理</button>
        <button class="debug-btn" onclick="app.showSettingsPage('system')">📊 系统状态</button>
        <button class="debug-btn" onclick="console.log(app.state)">📋 打印当前 state</button>
    </div>
</div>

<script>
// ============ Global State Management ============
const app = {
    state: {
        // Projects
        projects: [
            // Will be populated by flow
        ],
        currentProjectId: null,

        // Tasks
        tasks: {}, // { projectId: [{ id, name, status, runtime, ... }] }

        // Auth - Multiple credentials per runtime
        credentials: {
            // codex: {
            //   account: { status: 'valid'|'expired', email: '...', expiresAt: '2026-09-15' },
            //   'api-key': { status: 'valid', secret: 'sk-...ab12' }
            // }
            // activeMode: { codex: 'account'|'api-key' }
        },

        // Modal state
        currentModal: null, // 'createProject' | 'createTask' | 'stepX' | 'credentials' | 'projectMenu' | 'deleteProject' | 'registerImage' | null
        wizardData: {
            selectedRuntime: null,
            selectedAuthMode: null, // 'account' | 'api-key' （Step 2 选择的模式）
            authStatus: null, // 'pending' | 'success'
            deviceCode: 'ABCD1234',
            deviceCodeCountdown: 15 * 60,
            hasCredentialBeforWizard: false, // 向导启动时是否已有凭证
        },

        // Other
        showBanner: false,
        bannerType: null, // 'expired' | 'warning' | null
    },

    // Initialize
    init() {
        this.resetToColdStart();
        this.render();
        window.addEventListener('click', (e) => {
            if (!e.target.closest('.project-switcher')) {
                document.getElementById('projectDropdown').classList.remove('show');
            }
        });
    },

    // Reset to cold start (no projects, show init wizard)
    resetToColdStart() {
        this.state = {
            projects: [],
            currentProjectId: null,
            tasks: {},
            credentials: {},
            initialized: false, // 冷启动标记：未完成初始化向导
            currentModal: null, // 页面主状态不用 modal 驱动
            settingsMenuOpen: false,
            wizardData: {
                selectedRuntime: null,
                authMethod: null,
                authStatus: null,
                deviceCode: 'ABCD1234',
                deviceCodeCountdown: 15 * 60,
                selectedProjectId: null, // 确认步选择的项目
            },
            showBanner: false,
            bannerType: null,
            // 镜像管理状态
            images: [
                { id: 'img-1', name: 'AIO（预置）', uri: 'ghcr.io/agent-infra/sandbox:latest', status: 'valid', isActive: true, supportedRuntimes: ['codex', 'claude-code'], vars: [] },
                { id: 'img-2', name: 'ml-agent:v1.0（自定义）', uri: 'docker.io/myrepo/ml-agent:v1.0', status: 'warning', isActive: true, supportedRuntimes: ['codex'], warning: '缺少 tmux → 终端断线恢复将降级为缓冲重放', vars: [] },
            ],
            editingImageVars: {},
            showImageEditForm: false,
            newImageForm: { uri: '', validationResult: null }, // 新镜像注册表单状态
            taskListFolds: {}, // { projectId: true|false } 任务列表项目组折叠状态
            // 系统状态
            systemStatus: {
                cpu: { used: 4.2, total: 8, unit: '核' },
                ram: { used: 5.8, total: 16, unit: 'GB' },
                activeTasks: 5,
                providers: [
                    { name: 'aio', status: 'ok', desc: '容器运行时正常' },
                    { name: 'boxlite', status: 'disabled', desc: '未启用（v2.0 开放）' },
                ],
                connection: { rest: 'ok', ws: 'ok', wsLatency: 15 },
            },
            diagnostics: [],
            diagnosticsRunning: false,
            // 页面级状态（P21 总览，设置页改为独立页）
            currentPage: 'workbench', // 'workbench' | 'settings'
            currentSettingsTab: 'credentials', // 'credentials' | 'images' | 'system'
        };
    },

    // Jump to state with 2 projects and tasks
    jumpToStateWithTasks() {
        this.state.projects = [
            { id: 'proj-1', name: 'MyProject', source: 'empty', taskCount: 2 },
            { id: 'proj-2', name: 'DataPipeline', source: 'git', url: 'https://github.com/user/data-pipeline', taskCount: 1 },
        ];
        this.state.currentProjectId = 'proj-1';
        this.state.tasks = {
            'proj-1': [
                { id: 'task-1', name: 'Task-001', status: 'running', runtime: 'codex', createdAt: '08:12' },
                { id: 'task-2', name: 'Task-002', status: 'stopped', runtime: 'codex', createdAt: '08:00' },
            ],
            'proj-2': [
                { id: 'task-3', name: 'DataSync', status: 'running', runtime: 'codex', createdAt: '09:30' },
            ],
        };
        this.state.credentials = {
            'codex': { method: 'account', email: 'user@example.com', status: 'valid' },
        };
        this.state.currentModal = null;
        this.render();
    },

    triggerCredExpiredBanner() {
        this.state.showBanner = true;
        this.state.bannerType = 'expired';
        this.render();
    },

    // Render entire app
    render() {
        // Render sidebar
        this.renderSidebar();
        // Render main area
        this.renderMain();
        // Render modal if needed
        this.renderModal();
    },

    renderSidebar() {
        const projectList = document.getElementById('projectList');
        const newTaskBtn = document.getElementById('newTaskBtn');
        const manageMenu = document.getElementById('manageProjectMenu');

        if (this.state.projects.length === 0) {
            projectList.innerHTML = '<div style="padding:10px; color:#999; font-size:12px;">无项目</div>';
            newTaskBtn.style.display = 'none';
            manageMenu.style.display = 'none';
        } else {
            projectList.innerHTML = this.state.projects.map(proj => `
                <div class="project-item ${proj.id === this.state.currentProjectId ? 'selected' : ''}"
                     onclick="app.selectProject('${proj.id}')">
                    📁 ${proj.name} <span style="color:#999;">(${proj.taskCount || 0} tasks)</span>
                </div>
            `).join('');
            newTaskBtn.style.display = 'block';
            manageMenu.style.display = 'block';
        }

        // Project switcher button
        const projectBtn = document.getElementById('projectBtn');
        const currentProj = this.state.projects.find(p => p.id === this.state.currentProjectId);
        if (currentProj) {
            projectBtn.innerHTML = `📁 ${currentProj.name}`;
            projectBtn.style.cursor = 'pointer';
            projectBtn.title = '点击在左侧树中定位该项目';
            projectBtn.onclick = () => {
                // 点击时展开该项目组并定位
                if (this.state.currentProjectId) {
                    this.state.taskListFolds[this.state.currentProjectId] = false; // 展开
                    this.render();
                }
            };
        } else {
            projectBtn.innerHTML = `📁 选择项目`;
            projectBtn.style.cursor = 'default';
            projectBtn.onclick = null;
        }

        // Task list (grouped by projects with expandable headers)
        const taskList = document.getElementById('taskList');

        // Calculate total task count across all projects
        let totalTasks = 0;
        for (const projId of Object.keys(this.state.tasks)) {
            totalTasks += (this.state.tasks[projId] || []).length;
        }

        if (this.state.projects.length === 0) {
            taskList.innerHTML = '';
        } else {
            let html = '';
            for (const proj of this.state.projects) {
                const projTasks = this.state.tasks[proj.id] || [];
                const taskCount = projTasks.length;
                const isFolded = this.state.taskListFolds[proj.id];
                const isCurrentProj = proj.id === this.state.currentProjectId;

                // Project group header（空项目组同样渲染——保证新建空项目在列表可见）
                html += `
                    <div class="task-group-header" style="cursor:pointer; padding:8px 12px; background:${isCurrentProj ? '#f0f8ff' : '#f9f9f9'}; border-left:3px solid ${isCurrentProj ? '#0066cc' : 'transparent'}; display:flex; align-items:center; gap:8px; font-weight:500; font-size:12px; user-select:none; position:relative;" onmouseover="this.querySelector('[data-menu]')?.style.display='block'" onmouseout="this.querySelector('[data-menu]')?.style.display='none'">
                        <span onclick="app.toggleTaskGroup('${proj.id}')" style="flex-shrink:0; cursor:pointer;">${isFolded ? '▸' : '▾'}</span>
                        <span style="flex:1; cursor:pointer; overflow:hidden; text-overflow:ellipsis;" onclick="app.toggleTaskGroup('${proj.id}')">${this.htmlEscape(proj.name)}</span>
                        <span style="background:#e3f2fd; color:#0066cc; padding:2px 6px; border-radius:2px; font-size:11px; flex-shrink:0;">${taskCount}</span>
                        <button data-menu style="display:none; background:none; border:none; cursor:pointer; padding:4px; color:#666; font-size:14px;" onclick="app.state.currentModal = 'projectMenu'; app.state.selectedProjectForMenu = '${proj.id}'; app.render()">⋯</button>
                    </div>
                `;
                if (taskCount === 0 && !isFolded) {
                    html += `
                        <div style="margin-left:4px; padding:8px 12px; font-size:12px; color:#0066cc; cursor:pointer;" onclick="app.switchProject('${proj.id}'); app.startNewTask()">
                            在 ${this.htmlEscape(proj.name)} 中发起第一个任务 →
                        </div>
                    `;
                }
                if (taskCount > 0) {
                    // Task list items (shown if not folded)
                    if (!isFolded) {
                        html += projTasks.map(task => `
                            <div class="task-item" onclick="app.selectTask('${task.id}'); app.switchProject('${proj.id}')" style="margin-left:4px;">
                                <div class="task-status status-${task.status}"></div>
                                <div style="flex:1;">
                                    <div style="font-size:13px; font-weight:500;">${task.name}</div>
                                    <div style="font-size:11px; color:#999;">${task.createdAt}</div>
                                </div>
                            </div>
                        `).join('');
                    }
                }
            }

            // 树底部：新建项目入口
            html += `
                <div style="border-top:1px solid #e0e0e0; margin-top:8px; padding:8px 12px;">
                    <div style="cursor:pointer; user-select:none; padding:8px; background:#f0f8ff; border-radius:4px; text-align:center; font-size:12px; color:#0066cc; font-weight:500;" onclick="app.state.currentModal = 'createProject'; app.render()">
                        + 新建项目
                    </div>
                </div>
            `;

            taskList.innerHTML = html;
        }
    },

                <div class="terminal-line">✓ 环境就绪</div>
                ${selectedTask?.initialPrompt ? `
                <div class="terminal-line" style="color:#00ff00;">agent@sandbox:~$ agent "${this.htmlEscape(selectedTask.initialPrompt)}"</div>
                <div class="terminal-line" style="color:#9cdcfe;">▸ 已接收任务指令，开始执行…</div>
                <div class="terminal-line" style="color:#9cdcfe;">▸ 正在分析工作区…</div>
                <div class="terminal-line" style="color:#00ff00;">agent&gt; _</div>

    renderSystemContent() {
        // 复用系统状态的内容
        const sys = this.state.systemStatus;
        const cpuPercent = Math.round((sys.cpu.used / sys.cpu.total) * 100);
        const ramPercent = Math.round((sys.ram.used / sys.ram.total) * 100);
        const cpuBar = '▓'.repeat(Math.ceil(cpuPercent / 10)) + '░'.repeat(10 - Math.ceil(cpuPercent / 10));
        const ramBar = '▓'.repeat(Math.ceil(ramPercent / 10)) + '░'.repeat(10 - Math.ceil(ramPercent / 10));

        let diagnosticsHtml = '';
        if (this.state.diagnostics.length > 0) {
            diagnosticsHtml = this.state.diagnostics.map(d => `
                <div style="margin-bottom:8px; font-size:11px;">
                    ${d.status === 'ok' ? '✅' : d.status === 'warn' ? '⚠️' : '❌'} ${this.htmlEscape(d.item)}: ${this.htmlEscape(d.desc || '')}
                    ${d.fix ? `<br><span style="color:#0066cc; cursor:pointer;">[${d.fix}]</span>` : ''}
                </div>
            `).join('');
        }

        return `
            <div style="margin-bottom:16px;">
                <div style="font-weight:500; margin-bottom:8px;">📊 系统资源使用情况</div>
                <div style="font-size:12px;">
                    CPU: ${cpuBar} ${sys.cpu.used}/${sys.cpu.total} ${sys.cpu.unit} (${cpuPercent}%)<br>
                    RAM: ${ramBar} ${sys.ram.used}/${sys.ram.total} ${sys.ram.unit} (${ramPercent}%)
                </div>
                <div style="margin-top:8px; font-size:12px; ${cpuPercent > 80 ? 'color:#d32f2f;' : 'color:#388e3c;'}">
                    ${cpuPercent > 95 ? '🔴 资源耗尽' : cpuPercent > 80 ? '⚠️ 资源紧张，建议停止部分 Task' : '✅ 资源充足'} · 当前活跃 Task: ${sys.activeTasks}
                </div>
            </div>

            <div style="margin-bottom:16px;">
                <div style="font-weight:500; margin-bottom:8px;">🏃 Provider 状态</div>
                <div style="font-size:12px;">
                    ${sys.providers.map(p => `
                        <div style="margin-bottom:4px;">
                            ${p.status === 'ok' ? '✅' : '⏸️'} ${p.name}（${p.desc}）
                        </div>
                    `).join('')}
                </div>
            </div>

            <div style="margin-bottom:16px;">
                <div style="font-weight:500; margin-bottom:8px;">🌐 连接状态</div>
                <div style="font-size:12px;">
                    REST ✅ · WS ${sys.connection.ws === 'ok' ? '✅' : '❌'}(${sys.connection.wsLatency}ms) · 终端 2 连接<br>
                    <span style="color:#999; font-size:11px;">上次事件推送: 1 秒前</span>
                </div>
            </div>

            <div style="margin-bottom:16px;">
                <div style="font-weight:500; margin-bottom:8px;">🔧 诊断</div>
                <div id="diagnosticsPanel" style="font-size:11px; background:#f5f5f5; padding:8px; border-radius:4px;">
                    ${this.state.diagnosticsRunning ? `
                        <div style="color:#666;">正在诊断中...</div>
                    ` : diagnosticsHtml || `
                        <div style="color:#999;">点击下方按钮开始诊断</div>
                    `}
                </div>
            </div>

            <div class="btn-group">
                <button class="btn" onclick="app.runDiagnostics()">${this.state.diagnosticsRunning ? '诊断中...' : '重新诊断'}</button>
            </div>
            <span class="doc-anchor">P21-5</span>
        `;
    },

    backToWorkbench() {
        this.state.currentPage = 'workbench';
        this.state.currentSettingsTab = 'credentials';
        this.render();
    },

    switchSettingsTab(tab) {
        this.state.currentSettingsTab = tab;
        this.render();
    },

    showSettingsPage(tab) {
        this.state.currentPage = 'settings';
        this.state.currentSettingsTab = tab || 'credentials';
        this.render();
    },

    htmlEscape(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return (text || '').replace(/[&<>"']/g, m => map[m]);
    },

    renderBanner() {
        const banner = document.getElementById('banner');
        const bannerText = document.getElementById('bannerText');
        const bannerBtn = document.getElementById('bannerBtn');

        if (this.state.showBanner && this.state.bannerType === 'expired') {
            banner.classList.add('show');
            bannerText.textContent = '⚠️ Codex 凭证将在 3 天内过期';
            bannerBtn.textContent = '重新授权';
            bannerBtn.onclick = () => app.showCredentialsPage();
        } else {
            banner.classList.remove('show');
        }
    },

    renderModal() {
        const overlay = document.getElementById('modalOverlay');
        const modal = document.getElementById('modal');

        if (!this.state.currentModal) {
            overlay.classList.remove('show');
            return;
        }

        overlay.classList.add('show');

        // currentModal 只处理弹层类型（不包括 'welcome'）
        if (this.state.currentModal === 'editImageVars') {
            this.renderEditImageVarsModal();
        } else if (this.state.currentModal === 'registerImage') {
            this.renderRegisterImageModal();
        } else if (this.state.currentModal === 'createProject') {
            this.renderCreateProjectModal();
        } else if (this.state.currentModal === 'step1') {
            this.renderStep1Modal();
        } else if (this.state.currentModal === 'step3') {
            this.renderStep3Modal();
        } else if (this.state.currentModal === 'authIntercept') {
            this.renderAuthInterceptPanel();
        } else if (this.state.currentModal === 'progress') {
            this.renderProgressModal();
        } else if (this.state.currentModal === 'credentials') {
            // 旧弹层形态已废弃（v1.0.1 设置页化）：重定向到设置页
            this.state.currentModal = null;
            this.showSettingsPage('credentials');
            return;
        } else if (this.state.currentModal === 'projectMenu') {
            this.renderProjectMenuModal();
        } else if (this.state.currentModal === 'gitCredentials') {
            this.renderGitCredentialsModal();
        } else if (this.state.currentModal === 'imageParams') {
            this.renderImageParamsModal();
        } else if (this.state.currentModal === 'images') {
            this.state.currentModal = null;
            this.showSettingsPage('images');
            return;
        } else if (this.state.currentModal === 'system') {
            this.state.currentModal = null;
            this.showSettingsPage('system');
            return;
        }
    },

    completeAuthIntercept() {
        const runtime = this.state.wizardData.selectedRuntime;
        const mode = this.state.wizardData.selectedAuthMode || 'account';

        if (mode === 'apikey') {
            const key = document.getElementById('apiKeyInput')?.value;
            if (!key) {
                this.showToast('❌ 请输入 API Key');
                return;
            }
            this.state.credentials[runtime] = this.state.credentials[runtime] || {};
            this.state.credentials[runtime]['api-key'] = {
                status: 'valid',
                secret: key.substring(0, 7) + '...ab12',
            };
            if (!this.state.credentials.activeMode) this.state.credentials.activeMode = {};
            this.state.credentials.activeMode[runtime] = 'api-key';
        } else {
            // 帐号授权：面板内即时完成（决策 1，auth helper 跑登录流——技术 05 §2 决策 A）
            if (runtime !== 'codex') {
                const code = document.getElementById('setupTokenInput')?.value;
                if (!code) { this.showToast('❌ 请先粘贴授权码'); return; }
            }
            this.state.credentials[runtime] = this.state.credentials[runtime] || {};
            this.state.credentials[runtime].account = {
                status: 'valid',
                email: 'user@example.com',
                expiresAt: '2027-08-09',
            };
            if (!this.state.credentials.activeMode) this.state.credentials.activeMode = {};
            this.state.credentials.activeMode[runtime] = 'account';
        }

        this.showToast('✅ 登录成功，凭证已保存——自动进入确认步');
        this.state.currentModal = 'step3';
        this.render();
    },

    renderProgressModal() {
        const modal = document.getElementById('modal');
        const runtime = this.state.wizardData.selectedRuntime;
        const runtimeName = runtime === 'codex' ? 'Codex' : 'Claude Code';
        const progressState = this.state.wizardData.progressState || { currentStageIndex: 0, elapsedTime: 0 };

        // 决策 1：无「等待登录」阶段——鉴权已在拦截面板内完成，凭证在「启动实例」阶段由 Vault 注入（用户无感）
        const stages = [
            { name: '初始化', duration: 1200 },
            { name: '拉取镜像 150/800MB（预计还需 40s）', duration: 2000 },
            { name: '准备工作区（克隆项目独立副本）', duration: 1500 },
            { name: '启动实例（凭证注入·无感）', duration: 1300 },
            { name: '连接终端', duration: 1000 },
        ];

        const currentStageIndex = progressState.currentStageIndex;
        const totalElapsed = stages.slice(0, currentStageIndex + 1).reduce((sum, s) => sum + s.duration, 0);

        modal.innerHTML = `
            <div class="modal-header">🔄 正在发起 ${runtimeName} 任务   ⏱️ 已耗时 ${Math.round(totalElapsed / 1000)}s</div>
            <div class="progress-card">
                ${stages.map((s, i) => `
                    <div class="progress-step">
                        <div class="progress-icon">
                            ${i < currentStageIndex ? '✅' : (i === currentStageIndex ? '🔄' : '⏳')}
                        </div>
                        <div style="flex:1;">${s.name}</div>
                    </div>

                `).join('')}
            </div>
            <div style="margin-top:16px; display:flex; gap:8px;">
                <button class="btn btn-secondary" onclick="app.closeModal()">后台运行</button>
                <button class="btn btn-secondary" onclick="app.cancelTask()">取消</button>
            </div>
            <span class="doc-anchor">P21-2 形态 D · 无等待登录（决策 1）</span>
        `;

        // Automatically progress through stages
        if (currentStageIndex < stages.length - 1) {
            setTimeout(() => {
                if (!this.state.wizardData.progressState) {
                    this.state.wizardData.progressState = { currentStageIndex: 0, elapsedTime: 0 };
                }
                this.state.wizardData.progressState.currentStageIndex++;
                this.render();
            }, stages[currentStageIndex].duration);
        } else if (currentStageIndex === stages.length - 1) {
            // All stages complete
            setTimeout(() => {
                this.finishTaskCreation();
            }, stages[currentStageIndex].duration);
        }
    },

        const imageName = this.state.wizardData.selectedImageName || 'AIO（预置）';

        // 使用确认步选择的项目，或回退到当前项目
        const targetProjectId = this.state.wizardData.selectedProjectId || this.state.currentProjectId;

        const newTask = {
            id: taskId,
            name: `Task-${String((this.state.tasks[targetProjectId]?.length || 0) + 1).padStart(3, '0')}`,
            status: 'running',
            runtime: runtime,
            image: imageName, // 记录所选镜像
            initialPrompt: this.state.wizardData.initialPrompt || null,
            createdAt: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
        };

        if (!this.state.tasks[targetProjectId]) {
            this.state.tasks[targetProjectId] = [];
        }
        this.state.tasks[targetProjectId].push(newTask);

        // 更新目标项目为当前项目，并展开任务树
        this.state.currentProjectId = targetProjectId;
        if (this.state.taskListFolds[targetProjectId]) {
            this.state.taskListFolds[targetProjectId] = false; // 展开
        }

        const proj = this.state.projects.find(p => p.id === targetProjectId);
        if (proj) proj.taskCount = this.state.tasks[targetProjectId].length;

        this.state.currentModal = null;
        this.state.wizardData = {
            selectedRuntime: null,
            selectedAuthMode: null,
            authStatus: null,
            deviceCode: 'ABCD1234',
            deviceCodeCountdown: 15 * 60,
            hasCredentialBeforWizard: false,
            waitingForLoginInProgress: false,
            selectedProjectId: null,

        const gitCreds = this.state.credentials.git || {};

                </div>
            `;
        }

        let gitHtml = '<div style="border:1px solid #d0d0d0; border-radius:4px; padding:16px;">';

        if (hasSSHKey) {
            gitHtml += `
                <div style="margin-bottom:12px; padding:12px; background:#f9f9f9; border-radius:4px;">
                    <div style="font-weight:500; margin-bottom:6px;">🔑 SSH 私钥</div>

                    <button class="btn" style="padding:4px 12px; font-size:11px; margin-top:8px; margin-right:8px;" onclick="app.testGitConnection('ssh')">测试连接</button>

                </div>

        }

        if (hasHTTPSToken) {
            gitHtml += `
                <div style="padding:12px; background:#f9f9f9; border-radius:4px;">
                    <div style="font-weight:500; margin-bottom:6px;">🔐 HTTPS Token</div>

            } else {
                validationHtml = `<div style="padding:8px; background:#ffcdd2; border-left:4px solid #f44336; border-radius:2px; font-size:12px; margin-top:12px;">❌ 验证失败：镜像不符合平台约定</div>`;

            return;
        }
        this.state.newImageForm.uri = uri;
        const status = uri.includes('invalid') ? 'error' :
                      uri.includes('warning') ? 'warning' : 'success';
        this.state.newImageForm.validationResult = { status };
        this.renderRegisterImageModal();

        if (!this.state.images) this.state.images = [];

            id: 'img-' + Date.now(),

            status: 'valid',

    captureImageVarEdits() {
        const st = this.state.editingImageVars;
        if (!st) return;
        st.vars = st.vars.map((v, idx) => {
            const el = document.getElementById('ivv_' + idx);
            const typed = el?.value ?? '';
            // secret 原值不回显：输入为空且标记 keep 时保持原值
            const value = (el?.dataset?.keep === '1' && typed === '') ? (v.value ?? '') : (el ? typed : (v.value ?? ''));
            return {
                key: (document.getElementById('ivk_' + idx)?.value ?? v.key ?? '').trim(),
                value,
                secret: document.getElementById('ivs_' + idx)?.checked ?? !!v.secret,
            };

    saveImageVars() {
        this.captureImageVarEdits();
        const st = this.state.editingImageVars;
        if (!st) return;
        const blacklist = ['ANTHROPIC_API_KEY','OPENAI_API_KEY','CLAUDE_CODE_OAUTH_TOKEN','CODEX_AUTH_TOKEN','GIT_SSH_KEY','GIT_HTTPS_TOKEN'];
        const rows = st.vars.filter(v => v.key);
        for (const v of rows) {
            const K = v.key.toUpperCase();
            if (blacklist.includes(K) || K.startsWith('GIT_') || K.startsWith('CODEX_')) {
                this.showToast('❌ 该变量名为系统保留，请使用凭证管理配置');
                return;
            }
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(v.key)) {
                this.showToast(`❌ 变量名不合法：${v.key}`);
                return;
            }
        }
        const img = this.state.images.find(i => i.id === st.imageId);
        if (img) img.vars = rows;
        this.state.editingImageVars = null;
        this.state.currentModal = null;
        this.showToast('✓ 环境变量已保存');
        this.showImagesPage();
    },

                        (method === 'api-key' && activeMode === 'api-key');

        if (credentials[method]) {
            delete credentials[method];
        }

        if (isActive) {
            // Find if there's another valid credential
            const hasOtherCred = (method === 'account' && credentials['api-key']?.status === 'valid') ||
                                (method === 'api-key' && credentials.account?.status === 'valid');

            if (hasOtherCred) {
                // Show dialog asking to switch
                const overlay = document.getElementById('modalOverlay');
                const modal = document.getElementById('modal');

                overlay.classList.add('show');
                modal.innerHTML = `
                    <div class="confirm-dialog">
                        <div class="confirm-title">切换凭证模式</div>
                        <div class="confirm-message">
                            另一模式已配置凭证，要切换过去吗？
                        </div>
                        <div class="confirm-actions">
                            <button class="btn btn-secondary" onclick="app.finalizRevokeWithoutSwitch('${runtime}')">不切换</button>
                            <button class="btn" onclick="app.finalizRevokeWithSwitch('${runtime}', '${method === 'account' ? 'api-key' : 'account'}')">切换过去</button>
                        </div>
                    </div>
                `;
            } else {
                // No other credential available
                if (!this.state.credentials.activeMode) this.state.credentials.activeMode = {};
                this.state.credentials.activeMode[runtime] = null;
                this.showToast(`✓ 凭证已吊销`);
                this.state.currentModal = 'credentials';
                this.render();
            }
        } else {
            this.showToast(`✓ 凭证已吊销`);
            this.state.currentModal = 'credentials';
            this.render();
        }
    },

    finalizRevokeWithSwitch(runtime, newMode) {
        if (!this.state.credentials.activeMode) this.state.credentials.activeMode = {};
        this.state.credentials.activeMode[runtime] = newMode;
        this.showToast(`✓ 凭证已吊销，已切换到 ${newMode === 'api-key' ? 'API Key' : '帐号授权'} 模式`);
        this.state.currentModal = 'credentials';
        this.render();
    },

    finalizRevokeWithoutSwitch(runtime) {
        if (!this.state.credentials.activeMode) this.state.credentials.activeMode = {};
        this.state.credentials.activeMode[runtime] = null;
        this.showToast(`✓ 凭证已吊销，当前模式已禁用`);
        this.state.currentModal = 'credentials';
        this.render();
    },

    closeModal() {
        this.state.currentModal = null;
        this.render();
    },

    showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    },

    // Debug functions
    resetToUninitialized() {
        this.state = {
            projects: [],
            currentProjectId: null,
            tasks: {},
            credentials: {},
            initialized: false, // 未初始化标记
            currentModal: null,
            wizardData: {
                selectedRuntime: null,
                authMethod: null,
                authStatus: null,
                deviceCode: 'ABCD1234',
                deviceCodeCountdown: 15 * 60,
            },
            showBanner: false,
            bannerType: null,
        };
        this.showToast('🔧 已重置为未初始化状态 → 显示初始化向导');
        this.render();
    },

    jumpToStateWithTasks() {
        this.state.projects = [
            { id: 'proj-1', name: 'MyProject', source: 'empty', taskCount: 2 },
            { id: 'proj-2', name: 'DataPipeline', source: 'git', url: 'https://github.com/user/data-pipeline', taskCount: 1 },
        ];
        this.state.currentProjectId = 'proj-1';
        this.state.tasks = {
            'proj-1': [
                { id: 'task-1', name: 'Task-001', status: 'running', runtime: 'codex', createdAt: '08:12' },
                { id: 'task-2', name: 'Task-002', status: 'stopped', runtime: 'codex', createdAt: '08:00' },
            ],
            'proj-2': [
                { id: 'task-3', name: 'DataSync', status: 'running', runtime: 'codex', createdAt: '09:30' },
            ],
        };
        this.state.credentials = {
            'codex': {
                'account': { status: 'valid', email: 'user@example.com', expiresAt: '2026-09-15' },
                'api-key': { status: 'valid', secret: 'sk-...ab12' }
            },
            'activeMode': { 'codex': 'account' }
        };
        this.state.initialized = true;
        this.state.currentModal = null;
        this.render();
    },

    resetToNoCredState() {
        // Reset all credentials
        this.state.credentials = {
            'codex': {},
            'activeMode': {}
        };
        this.state.projects = [
            { id: 'proj-1', name: 'MyProject', source: 'empty', taskCount: 0 },
        ];
        this.state.currentProjectId = 'proj-1';
        this.state.tasks = { 'proj-1': [] };
        this.state.initialized = true;
        this.state.currentModal = null;
        this.showToast('↺ 已重置为无凭证状态');
        this.render();
    },

    triggerCredExpiredBanner() {
        this.state.showBanner = true;
        this.state.bannerType = 'expired';
        this.render();
    },

    // Toggle project dropdown
    toggleProjectDropdown() {
        const dropdown = document.getElementById('projectDropdown');
        dropdown.classList.toggle('show');
    },

    // ============ Git Credentials (New) ============
    showGitCredentialPanel(type) {
        this.state.gitCredentialType = type; // Store which type to configure
        this.state.currentModal = 'gitCredentials';
        this.render();
    },

    saveGitCredential(type) {
        if (!this.state.credentials.git) this.state.credentials.git = {};

        if (type === 'ssh') {
            this.state.credentials.git.ssh = {
                fingerprint: 'SHA256:abc123def456... (模拟)',
                lastUsed: '未使用'
            };
            this.showToast('✅ SSH 密钥已保存');
        } else {
            const platform = document.getElementById('httpsPlatform')?.value || 'github';
            this.state.credentials.git.https = {
                type: platform.toUpperCase(),
                tail: '...ab12 (模拟)',
                lastUsed: '未使用'
            };
            this.showToast('✅ HTTPS Token 已保存');
        }
        // 回程（P22 §2）：若因 clone 权限失败跳转而来，返回项目创建弹层重试
        if (this.state.pendingProjectCreate) {
            this.state.currentPage = 'workbench';
            this.state.currentModal = 'createProject';
            this.showToast('✅ Git 凭证已保存——请点击 [创建] 重试克隆');
        } else {
            this.state.currentModal = null;
            this.showSettingsPage('credentials');
        }
        this.render();
    },

    testGitConnection(type) {
        this.showToast(`✅ Git ${type} 连接测试成功`);
    },

    revokeGitCredential(type) {
        if (!this.state.credentials.git) return;
        delete this.state.credentials.git[type];
        this.showToast(`✓ Git ${type.toUpperCase()} 凭证已吊销`);
        this.render();
    },

    switchTab(tabName, element) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        element.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('show'));
        document.getElementById(tabName + 'Panel').classList.add('show');
    },

    // ============ Image Parameters (New) ============
    addImageEnv() {
        if (!this.state.imageParams) this.state.imageParams = { env: {}, cmd: '' };
        const key = (document.getElementById('newEnvKey')?.value || '').trim();
        const value = document.getElementById('newEnvVal')?.value || '';
        if (!key) { this.showToast('⚠️ 请输入变量名'); return; }
        const blacklist = ['ANTHROPIC_API_KEY','OPENAI_API_KEY','CLAUDE_CODE_OAUTH_TOKEN','CODEX_AUTH_TOKEN','GIT_SSH_KEY','GIT_HTTPS_TOKEN'];
        const K = key.toUpperCase();
        if (blacklist.includes(K) || K.startsWith('GIT_') || K.startsWith('CODEX_')) {
            this.showToast('❌ 该变量名为系统保留，请使用凭证管理配置');
            return;
        }
        if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) { this.showToast('❌ 变量名不合法'); return; }
        if (!this.state.imageParams.env) this.state.imageParams.env = {};
        this.state.imageParams.env[key] = { value, secret: false };
        this.showToast(`✓ 环境变量 ${key} 已添加`);
        this.render();
    },

    removeImageEnv(key) {
        if (this.state.imageParams?.env) {
            delete this.state.imageParams.env[key];
            this.showToast(`✓ 环境变量已删除`);
            this.render();
        }
    },

    // ============ Project Creation with Git Failure Handling ============
    createProject() {
        const name = document.getElementById('newProjectName')?.value || '新项目';
        const source = document.querySelector('input[name="source"]:checked').value;
        const url = source === 'git' ? (document.getElementById('gitUrl').value || '') : null;

        const hasGitCred = !!(this.state.credentials.git && (this.state.credentials.git.ssh || this.state.credentials.git.https));
        if (source === 'git' && url && !hasGitCred) {
            // 模拟：未配置 Git 凭证时私有仓克隆失败（配置后重试即成功）
            if (url.includes('private') || Math.random() > 0.5) {
                if (!url.includes('public')) {
                    // Show failure and guide to Git credential config
                    this.state.projectCreationError = `❌ 克隆失败：无权访问该仓库（401/403）。是否为私有仓库？`;
                    this.state.pendingProjectCreate = { name, source, url };
                    this.render();

                    // Show action
                    setTimeout(() => {
                        const overlay = document.getElementById('modalOverlay');
                        const modal = document.getElementById('modal');
                        overlay.classList.add('show');
                        modal.innerHTML = `
                            <div class="confirm-dialog">
                                <div class="confirm-title">配置 Git 凭证</div>
                                <div class="confirm-message">
                                    克隆失败可能是因为权限不足。请先配置 Git 凭证，然后重试克隆。
                                </div>
                                <div class="confirm-actions">
                                    <button class="btn btn-secondary" onclick="app.closeModal()">取消</button>
                                    <button class="btn" onclick="app.navigateToGitCredConfig()">配置 Git 凭证</button>
                                </div>
                            </div>
                        `;
                    }, 500);
                    return;
                }
            }
        }

        const projId = 'proj-' + Date.now();
        this.state.projects.push({
            id: projId,
            name: name,
            source: source,
            url: url,
            taskCount: 0,
        });
        this.state.currentProjectId = projId;
        this.state.tasks[projId] = [];
        this.state.projectCreationError = null;
        this.state.pendingProjectCreate = null;
        // 向导内「+ 新建项目…」的回程：回确认步并选中新项目（表单值经 wizardData 保留）
        if (this.state.wizardReturn) {
            this.state.wizardReturn = false;
            this.state.wizardData.selectedProjectId = projId;
            this.state.currentModal = 'step3';
        } else {
            this.state.currentModal = null;
        }

        this.showToast(`✓ 项目 "${name}" 创建成功`);
        this.render();
    },

    navigateToGitCredConfig() {
        this.state.currentModal = null;
        this.showSettingsPage('credentials');
        this.showToast('ℹ️ 配置 Git 凭证后将返回项目创建');
    },

    // ============ Utility Methods ============
};

// Attach toggle to button
document.addEventListener('DOMContentLoaded', () => {
    app.init();
    document.getElementById('projectBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        app.toggleProjectDropdown();
    });
});
</script>
</body>
</html>
