  设计语言 v2 · 交互原型（gap/proto 工作副本：pilot 原型 + 本轮补全稿的接线）
  - 外壳常驻、主区切换的单页应用；视图与弹层的标记与静态稿同源：tools/build-proto.cjs 把试点（../../pilot/p*.html）与补全稿（../drafts/f-*.html）里的部件
    原样拷进下面的 <template>（标在 @copy … @end 之间，别手改这几段；--check 校验同步）；数据由 js/*.js 按同一套类名填进去。
  - 只用纯 HTML + 少量 JS（经典脚本 + 全局命名空间 window.P，按顺序加载：core → ui → flows-prj → flows-lch → flows-crd → flows-img → flows-sys → flows-wb → flows-aut），
    不引框架、不加载任何外部资源；状态只在内存里，主题与侧栏收起记在 localStorage（读写都 try/catch）。
    （第三段起加载顺序：core → ui → flows-prj → flows-lch → flows-crd → flows-img → flows-sys → flows-dep → flows-wb → flows-aut；第四段把 flows-wb / flows-aut 写满）
  - 说明见 notes/wiring.md（模块、公共函数、数据字段、场景、每个流程怎么走）；端到端测试 tools/proto-test.cjs。
-->

<meta charset="utf-8">

<script>
/* 首帧前定主题（跟随系统 / 亮 / 暗），避免先闪一下暗色；拿不到 localStorage 时按跟随系统 */
(function () {
  var m = 'system';
  try { m = localStorage.getItem('pilot-proto-theme') || 'system'; } catch (e) {}
  var t = m;
  if (m !== 'light' && m !== 'dark') {
    try { t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { t = 'dark'; }
  }
  document.documentElement.setAttribute('data-theme', t);
  document.documentElement.classList.add('proto-booting'); /* 启动这一刻按记住的状态收起侧栏：不播 ⌘B 的宽度过渡（js/core.js 首屏后移除） */
})();
</script>

<template id="tpl-credentials">
<!-- @copy ../../pilot/p3-credentials.html header,main -->
<header class="header">

              <p>凭证加密保存在这台机器上，不会上传；平台也读不回明文。</p>
              <p>帐号登录在你自己的浏览器里完成，平台不接触你的密码。</p>
              <p>SSH 私钥与 Token 存进去之后就不再显示，只留指纹 / 尾号用来认人。</p>
            </footer>

          </div>
        </div>
      </main>

<template id="tpl-img-sheet">
<!-- @copy ../drafts/f-img-register-05.html el:.sheet -->
<aside class="sheet" id="img-req" role="complementary" aria-label="平台对镜像的要求" data-testid="image-requirements-panel">
    <header class="sheet__header">
      <div class="sheet__heading">
        <h3 class="sheet__title"><span class="icon i-clipboard-list" aria-hidden="true"></span>平台对镜像的要求</h3>
        <p class="sheet__desc">前两条不满足会 <strong>拦住注册</strong>，后两条不会。这个面板不会自动关掉 —— 改 Dockerfile 时可以一直开着对照。</p>
      </div>
      <button class="btn btn--tertiary btn--28 sheet__close" type="button">关闭</button>
    </header>
    <div class="sheet__body">
      <ol class="sheet__list">
        <li class="sheet__item" data-testid="image-requirement-lineage" data-blocking="true"><p class="sheet__item-head">① 必须从平台的预制镜像改起<span class="badge badge--20 badge--neutral">不满足会被拒绝注册</span></p><p class="sheet__item-text">Dockerfile 的第一行要 FROM 平台预制镜像（或它的派生）。平台比对的是镜像内容本身（镜像层），所以加标签、改名、重新打一个 tag 都不算数 —— 内容对不上就会被拒。被拒时错误里会列出当前可用的预制镜像坐标，照着改就行。</p></li>
        <li class="sheet__item" data-testid="image-requirement-entrypoint" data-blocking="true"><p class="sheet__item-head">② 必须有启动命令与工作目录<span class="badge badge--20 badge--neutral">不满足会被拒绝注册</span></p><p class="sheet__item-text">镜像要有 Entrypoint 或 Cmd（两者有其一即可），并且要有 WorkingDir。少了启动命令，平台不知道怎么把它跑起来；少了工作目录，代码不知道该放哪儿。</p></li>
        <li class="sheet__item" data-testid="image-requirement-tmux" data-blocking="false"><p class="sheet__item-head">③ tmux：你不用做什么，但别删掉它<span class="badge badge--20 badge--neutral">只是提醒，不拦你</span></p><p class="sheet__item-text">预制镜像里已经装好了 tmux，你的镜像从它改起就自然带着。注册时平台不检查它（镜像标签会被派生镜像继承，所以标签说了不算）。但如果你在自己的镜像里把它删掉了，任务真正启动时会当场失败 —— Agent 会话由任务里的 tmux 持有，没有它，平台一重启就会丢掉正在跑的会话，因此不做静默降级。</p></li>
        <li class="sheet__item" data-testid="image-requirement-preinstall" data-blocking="false"><p class="sheet__item-head">④ 没预装 Agent CLI 只是提醒，不拦你<span class="badge badge--20 badge--neutral">只是提醒，不拦你</span></p><p class="sheet__item-text">镜像可以用 platform.supportedRuntimes 声明自己预装了哪些 Agent 的 CLI。没有声明照样能注册，只会给一条提醒：那时 CLI 会在创建任务时现装，任务启动会明显变慢（具体多久取决于这台机器的沙箱环境，这里不给一个会骗人的数字）。</p></li>
      </ol>
    </div>
  </aside>
<!-- @end -->
</template>

<template id="tpl-aut-form">
<!-- @copy ../drafts/f-aut-rules-04.html dialog -->
<div class="dialog dialog--aut" role="dialog" aria-modal="true" aria-labelledby="aut-title" aria-describedby="aut-sub">
      <div class="dialog__header">
        <h2 class="dialog__title" id="aut-title">自动化规则</h2>
        <p class="dialog__subtitle" id="aut-sub">在 acme-web 中</p>
      </div>
      <div class="dialog__body">
        <p class="form-note">新建自动化规则：到点自动起一个无头任务，跑完自动销毁实例、只留成果。</p>
        <div class="field">
          <label class="field__label" for="f-name">名称</label>
          <input class="input" id="f-name" type="text" value="每天凌晨跑一遍回归">
        </div>
        <div class="field">
          <label class="field__label" for="f-desc">描述<span class="field__optional">（可选）</span></label>
          <input class="input" id="f-desc" type="text" value="main 分支每晚回归一次，失败发通知">
        </div>
        <div class="field">
          <label class="field__label" for="f-agent">用哪个 Agent 跑</label>
          <span class="select"><select class="select__control" id="f-agent"><option value="">请选择</option><option value="codex" selected>Codex</option><option value="claude-code">Claude Code</option></select><span class="icon i-chevron-down select__icon" aria-hidden="true"></span></span>
        </div>
        <div class="field">
          <div class="aut-field-head"><label class="field__label" for="f-prompt">任务内容</label><span class="aut-counter" id="f-prompt-count">168 / 8000</span></div>
          <textarea class="textarea aut-prompt" id="f-prompt" rows="5" aria-describedby="f-prompt-count">在 main 分支最新代码上跑一遍完整回归：
1. pnpm install --frozen-lockfile
2. pnpm test（单元测试）
3. pnpm exec playwright test（e2e）
有失败就把失败用例、报错和最近相关的提交整理成一段说明，写进 reports/nightly.md；不要改业务代码。</textarea>
        </div>
        <fieldset class="aut-fieldset">
          <legend class="field__label">最长运行时间</legend>
          <div class="aut-options"><label class="aut-option"><input class="radio" type="radio" name="f-timeout">30 分钟</label><label class="aut-option"><input class="radio" type="radio" name="f-timeout">1 小时</label><label class="aut-option"><input class="radio" type="radio" name="f-timeout" checked>2 小时</label><label class="aut-option"><input class="radio" type="radio" name="f-timeout">4 小时</label></div>
          <p class="field__help">任务最长能跑多久。跑过头会被强制结束，并且这次算一次失败。</p>
        </fieldset>
        <fieldset class="aut-fieldset">
          <legend class="field__label">调度</legend>
          <div class="aut-options"><label class="aut-option"><input class="radio" type="radio" name="f-kind" checked>每天</label><label class="aut-option"><input class="radio" type="radio" name="f-kind">每小时</label><label class="aut-option"><input class="radio" type="radio" name="f-kind">每周</label><label class="aut-option aut-option--disabled"><input class="radio" type="radio" name="f-kind" disabled>自定义 cron（还没开放）</label></div>
          <div class="aut-inline"><label class="aut-sublabel" for="f-time">时间</label><input class="input input--32 aut-time i-clock" id="f-time" type="time" value="03:00"></div>
          <div class="field">
            <label class="aut-sublabel" for="f-tz">时区</label>
            <input class="input" id="f-tz" type="text" value="Asia/Shanghai" aria-describedby="f-tz-help">
            <p class="field__help" id="f-tz-help">默认取你当前的时区，建好之后就定下来了；之后你换机器或改系统时区都不会影响这条规则。</p>
          </div>
        </fieldset>
        <p class="aut-preview"><span class="icon icon--14 i-calendar-clock" aria-hidden="true"></span><span>预览：每天 03:00（Asia/Shanghai）</span></p>
        <details class="aut-adv" open>
          <summary class="aut-adv__summary"><span class="icon icon--14 i-chevron-right" aria-hidden="true"></span>高级选项</summary>
          <div class="aut-adv__body">
            <fieldset class="aut-fieldset">
              <legend class="field__label">并发模式</legend>
              <div class="aut-options aut-options--stack"><label class="aut-option"><input class="radio" type="radio" name="f-conc" checked>跳过（上次还在跑就不再起一个）</label><label class="aut-option aut-option--disabled"><input class="radio" type="radio" name="f-conc" disabled>排队（还没开放）</label><label class="aut-option aut-option--disabled"><input class="radio" type="radio" name="f-conc" disabled>并发（还没开放）</label></div>
            </fieldset>
            <fieldset class="aut-fieldset">
              <legend class="field__label">成果保留期</legend>
              <div class="aut-options"><label class="aut-option"><input class="radio" type="radio" name="f-keep">3 天</label><label class="aut-option"><input class="radio" type="radio" name="f-keep" checked>7 天</label><label class="aut-option"><input class="radio" type="radio" name="f-keep">30 天</label></div>
              <p class="field__help">成果会留在项目的「保留下来的成果」里，到期自动清理；到期之前都可以下载。</p>
            </fieldset>
          </div>
        </details>
        <fieldset class="aut-fieldset">
          <legend class="field__label">Webhook 通知</legend>
          <label class="aut-check"><input class="checkbox" type="checkbox" checked><span>启用（定时任务的价值就在「我不在的时候」，仅靠页面横幅收不到）</span></label>
          <input class="input" id="f-url" type="url" aria-label="Webhook URL" placeholder="https://example.com/hooks/automation" value="https://hooks.example.com/agent/acme-web">
          <div class="aut-options" role="radiogroup" aria-label="什么时候发通知"><label class="aut-option"><input class="radio" type="radio" name="f-trigger" checked>仅失败（含超时）</label><label class="aut-option"><input class="radio" type="radio" name="f-trigger">仅成功</label><label class="aut-option"><input class="radio" type="radio" name="f-trigger">全部</label></div>
          <div class="aut-test-row"><button class="btn btn--secondary btn--32" type="button">测试连接</button><p class="aut-msg aut-msg--ok" role="status"><span class="icon i-circle-check" aria-hidden="true"></span><span>测试消息已经送到了</span></p></div>
          <p class="field__help">投递超时 10 秒；失败重试 2 次（间隔 5 秒、25 秒）。两次重试仍失败只记一条投递失败，不影响规则的启用状态。</p>
        </fieldset>
      </div>
      <div class="dialog__footer">
        <button class="btn btn--secondary btn--32" type="button">取消</button>
        <div class="dialog__footer-end"><button class="btn btn--primary btn--32" type="button">保存规则</button></div>
      </div>
      <!-- 关闭按钮在对话框 DOM 末尾（同 P4 / 现状 AppDialog）：Esc、点遮罩、点它都关掉整个弹层 -->
      <button class="btn btn--tertiary btn--28 btn--icon dialog__close" type="button" aria-label="关闭"><span class="icon i-x" aria-hidden="true"></span></button>
    </div>
<!-- @end -->
</template>

      <div class="dialog__footer">
        <button class="btn btn--secondary btn--32" type="button" data-initial-focus>取消</button>
